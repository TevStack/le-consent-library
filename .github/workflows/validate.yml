# Validates the library on every push and pull request. Sites ignore an
# invalid download (they keep the bundled copy), but this catches mistakes
# before they're merged.
name: Validate library

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
